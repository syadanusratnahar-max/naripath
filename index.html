/* ================= NariPath voice =================
   Bangla sentences are pre-recorded with an open-source Bangla voice
   (Coqui "bn/custom/vits-female" by @mobassir94, Apache 2.0) and packed per page.
   Each sentence is found by a hash of its text. Anything not recorded falls back
   to the phone's own voice, if it has one. */
const NV={idx:null,loading:null,packs:new Map(),audio:null,token:0};
if(store.get("voiceV",0)!==2){ if(S.a11y.voice==="naripath") S.a11y.voice="auto"; try{ store.set("a11y",S.a11y); store.set("voiceV",2); }catch(e){} }
try{ speechSynthesis.addEventListener("voiceschanged",()=>{ if(route()==="settings") settingsPhoneVoices(); }); }catch(e){}
const NV_BASE="audio/bn/";
function nvSupported(){ try{ return !!document.createElement("audio").canPlayType('audio/ogg; codecs="opus"'); }catch(e){ return false; } }
function nvNorm(s){ return String(s).replace(/[✓✕★✗“”"]/g,"").replace(/\s+/g," ").trim(); }
function nvKey(s){ s=nvNorm(s); let h=0x811c9dc5; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h.toString(16).padStart(8,"0"); }
/* The text the reader speaks: the page, minus parts marked data-noread (calendar grids, dots). */
function readableText(v){
  const hide=[...v.querySelectorAll("[data-noread]")].map(e=>[e,e.style.display]);
  hide.forEach(([e])=>e.style.display="none"); const t=v.innerText; hide.forEach(([e,d])=>e.style.display=d); return t;
}
function speechChunks(text){
  return String(text).replace(/[✓✕★✗]/g,"").replace(/\n{2,}/g,"\n").split(/(?<=[।.!?:])\s+|\n+/).map(x=>x.trim()).filter(x=>x.length>1);
}
function nvIndex(){
  if(NV.idx) return Promise.resolve(NV.idx);
  if(!NV.loading) NV.loading=fetch(NV_BASE+"index.json").then(r=>r.ok?r.json():null).catch(()=>null).then(j=>{ NV.idx=(j&&j.clips)?j:{clips:{},packs:{}}; nvPrune(); return NV.idx; });
  return NV.loading;
}
/* Remove voice bundles from older versions that this index no longer uses. */
function nvPrune(){
  try{ const keep=new Set(Object.values(NV.idx.packs||{}).map(p=>p.f)); if(!keep.size||!("caches" in window)) return;
    caches.open("naripath-voice").then(c=>c.keys().then(ks=>ks.forEach(r=>{ const f=new URL(r.url).pathname.split("/").pop(); if(f!=="index.json"&&!keep.has(f)) c.delete(r); }))).catch(()=>{});
  }catch(e){}
}
function nvPack(id){
  if(NV.packs.has(id)) return NV.packs.get(id);
  const p=fetch(NV_BASE+NV.idx.packs[id].f).then(r=>{ if(!r.ok) throw new Error("pack"); return r.arrayBuffer(); });
  NV.packs.set(id,p); p.catch(()=>NV.packs.delete(id)); return p;
}
function nvPlay(buf,off,len,token){
  return new Promise(res=>{
    if(token!==NV.token) return res(false);
    const url=URL.createObjectURL(new Blob([buf.slice(off,off+len)],{type:"audio/ogg"}));
    const a=new Audio(url); NV.audio=a; a.playbackRate=S.a11y.rate==="slow"?0.85:1;
    const done=ok=>{ URL.revokeObjectURL(url); if(NV.audio===a) NV.audio=null; res(ok); };
    a.onended=()=>done(true); a.onerror=()=>done(false); a.onpause=()=>{ if(token!==NV.token) done(false); };
    a.play().catch(()=>done(false));
  });
}
function phoneSay(text,voice,want,token){
  return new Promise(res=>{
    if(token!==NV.token) return res(false);
    const u=new SpeechSynthesisUtterance(text);
    u.lang=voice?voice.lang:(want==="bn"?"bn-BD":"en-GB"); if(voice) u.voice=voice;
    u.rate=(want==="bn"?0.9:0.95)*(S.a11y.rate==="slow"?0.85:1);
    let fin=false; const done=ok=>{ if(fin) return; fin=true; clearTimeout(tm); res(ok); };
    u.onend=()=>done(true); u.onerror=()=>done(false);
    const tm=setTimeout(()=>done(false),Math.max(8000,text.length*320));
    try{ speechSynthesis.speak(u); }catch(e){ done(false); }
  });
}
function setListenUI(){
  const b=document.getElementById("listen"); if(!b) return;
  b.innerHTML = speaking
    ? `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>${t("stop")}`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>${t("listen")}`;
  b.setAttribute("aria-pressed",speaking);
  b.classList.toggle("on",speaking);
}
/* Speak a list of sentences. Returns false if nothing could be spoken. */
/* Bangla: the phone's own text-to-speech voice is used first when it has one (for example the
   Bangla voice in Google's "Speech Services" app, which sounds most natural). Otherwise, or if
   it fails, NariPath's recorded voice plays. "force" lets Settings test one voice on its own. */
function bnVoiceMode(voice,force){
  const pref=force||S.a11y.voice||"auto";
  if(pref==="phone") return voice?"phone":"nv";
  if(pref==="naripath"||pref==="nv") return "nv";
  return voice?"phone":"nv";
}
async function speakChunks(chunks,want,force){
  stopSpeech();
  const token=++NV.token;
  if(!chunks.length) return false;
  let voice=null;
  if("speechSynthesis" in window){ voice=pickVoice(await loadVoices(),want); }
  const mode=want==="bn"?bnVoiceMode(voice,force):"phone";
  const idx=(want==="bn"&&nvSupported()&&force!=="phone")?await nvIndex():null;
  const keys=chunks.map(nvKey);
  const have=idx?keys.filter(k=>idx.clips[k]).length:0;
  if(token!==NV.token) return false;
  if(force==="phone"&&!voice){ showVoiceHelp(!("speechSynthesis" in window)); return false; }
  if(!have&&!voice){
    if(want==="bn"){ if(idx&&Object.keys(idx.clips).length) toast(tx("This page has no recorded voice yet.","এই পাতার রেকর্ড করা ভয়েস এখনো নেই।")); else showVoiceHelp(!("speechSynthesis" in window)); }
    else toast(t("noTTS"));
    return false;
  }
  speaking=true; setListenUI();
  if(idx&&mode==="nv"){ [...new Set(keys.filter(k=>idx.clips[k]).map(k=>idx.clips[k][0]))].forEach(p=>nvPack(p).catch(()=>{})); }
  let phoneOk=mode==="phone";
  const playClip=async i=>{ const c=idx&&idx.clips[keys[i]]; if(!c) return false; let buf=null; try{ buf=await nvPack(c[0]); }catch(e){} return !!(buf&&await nvPlay(buf,c[1],c[2],token)); };
  for(let i=0;i<chunks.length;i++){
    if(token!==NV.token) return true;
    if(phoneOk){
      if(await phoneSay(chunks[i],voice,want,token)) continue;
      if(token!==NV.token) return true;
      phoneOk=false; try{speechSynthesis.cancel()}catch(e){}           // the phone voice failed: switch to recordings
      if(await playClip(i)) continue;
    } else {
      if(force!=="phone"&&await playClip(i)) continue;
      if(token!==NV.token) return true;
      if(voice&&force!=="nv") await phoneSay(chunks[i],voice,want,token);
    }
  }
  if(token===NV.token){ speaking=false; setListenUI(); }
  return true;
}
async function nvDownloadAll(){
  const st=document.getElementById("voice-status"); const idx=await nvIndex();
  const ids=Object.keys(idx.packs||{}); if(!ids.length){ if(st) st.textContent=tx("The voice files are not available here.","ভয়েস ফাইল এখানে পাওয়া যাচ্ছে না।"); return; }
  let n=0;
  for(const id of ids){ try{ await nvPack(id); }catch(e){ if(st) st.textContent=tx("Could not download. Check your internet and try again.","ডাউনলোড হয়নি। ইন্টারনেট দেখে আবার চেষ্টা করুন।"); return; }
    n++; if(st) st.textContent=tx(`Saving voice… ${Math.round(n/ids.length*100)}%`,`ভয়েস রাখা হচ্ছে… ${bnNum(String(Math.round(n/ids.length*100)))}%`); }
  try{ store.set("voiceSaved",idx.v||1); }catch(e){}
  if(st) st.textContent=tx("✓ Voice saved. Listening now works without internet.","✓ ভয়েস রাখা হয়েছে। এখন ইন্টারনেট ছাড়াই শোনা যাবে।");
}
async function settingsPhoneVoices(){
  const st=document.getElementById("phone-voice-status"), list=document.getElementById("phone-voice-list"); if(!st) return;
  let vs=[]; if("speechSynthesis" in window){ try{ vs=await loadVoices(); }catch(e){} }
  const bn=vs.filter(v=>/^bn/i.test(v.lang||"")||/bangla|bengali|বাংলা/i.test(v.name));
  const cur=pickVoice(vs,"bn");
  if(!document.getElementById("phone-voice-status")) return;
  if(cur){
    st.className="voice-found ok";
    st.innerHTML=`<b>✓ ${tx("Your phone has a Bangla voice","আপনার ফোনে বাংলা ভয়েস আছে")}</b><span class="small">${esc(cur.name)} · ${esc(cur.lang)}${S.a11y.voice==="naripath"?"":" · "+tx("NariPath will use it","নারীপথ এটাই ব্যবহার করবে")}</span>`;
    list.innerHTML=bn.length>1?`<div class="set-seg voice-pick" role="group" aria-label="${tx("Choose a phone voice","ফোনের ভয়েস বাছুন")}">${bn.map(v=>`<button type="button" data-voicename="${esc(v.name)}" aria-pressed="${v===cur}">${esc(v.name.replace(/^(Google|Microsoft)\s+/,""))} <span class="small muted">${esc(v.lang)}</span></button>`).join("")}</div>`:"";
  } else {
    st.className="voice-found no";
    st.innerHTML=`<b>${tx("No Bangla voice on this phone yet","এই ফোনে এখনো বাংলা ভয়েস নেই")}</b><span class="small">${tx("NariPath's recorded voice is being used. You can add Google's Bangla voice for free (steps below).","নারীপথের রেকর্ড করা ভয়েস ব্যবহার হচ্ছে। নিচের ধাপে বিনামূল্যে গুগলের বাংলা ভয়েস যোগ করতে পারেন।")}</span>`;
    list.innerHTML=""; const d=document.querySelector(".voice-how"); if(d) d.open=true;
  }
}
async function settingsVoiceInfo(){
  settingsPhoneVoices();
  const el=document.getElementById("voice-size"); if(!el) return;
  const idx=await nvIndex(); const bytes=Object.values(idx.packs||{}).reduce((a,p)=>a+(p.b||0),0);
  if(bytes) el.textContent=`(${S.lang==="bn"?bnNum((bytes/1048576).toFixed(1)):(bytes/1048576).toFixed(1)} MB)`;
  const st=document.getElementById("voice-status");
  if(st&&store.get("voiceSaved",0)===(idx.v||1)&&!st.textContent) st.textContent=tx("✓ Voice is saved on this phone.","✓ ভয়েস এই ফোনে রাখা আছে।");
}
document.addEventListener("click",e=>{
  if(e.target.closest("#voice-test")){ speakChunks(speechChunks(S.lang==="bn"?"আমি নারীপথের কণ্ঠ। আমি আপনাকে প্রতিটি পাতা পড়ে শোনাতে পারি।":"Hello. I am NariPath. I can read this page to you."),S.lang==="bn"?"bn":"en",S.lang==="bn"?"nv":undefined); return; }

document.addEventListener("submit",async e=>{
  if(e.target.id==="pc-unlock"){ e.preventDefault(); const v=document.getElementById("pc-pin-in").value.trim();

const TR={on:false,i:0,steps:[],ret:null};
function tourVisible(sel){ if(!sel) return true; const el=document.querySelector(sel); if(!el) return false; const r=el.getBoundingClientRect(); return r.width>0&&r.height>0; }
function startTour(force){
  if(TR.on) return;
  if(!force&&store.get("tour",0)) return;
  if(route()!=="home"){ location.hash="home"; }
  TR.on=true; TR.i=0; TR.ret=document.activeElement; stopSpeech();
  let ov=document.getElementById("tour");
  if(!ov){ ov=document.createElement("div"); ov.id="tour"; ov.innerHTML=`<div class="tour-dim"></div><div class="tour-spot" aria-hidden="true"></div><div class="tour-bub" role="dialog" aria-modal="true" aria-labelledby="tour-h" aria-describedby="tour-b"></div>`; document.body.appendChild(ov); }
  ov.hidden=false; document.querySelector(".app").setAttribute("inert",""); document.documentElement.classList.add("touring");
  tourShow(0);
}
function tourEnd(){
  if(!TR.on) return; TR.on=false; stopSpeech();
  const ov=document.getElementById("tour"); if(ov) ov.hidden=true;
  document.querySelector(".app").removeAttribute("inert"); document.documentElement.classList.remove("touring");
  store.set("tour",1);
  const h=document.querySelector("#view h1"); if(h){ h.setAttribute("tabindex","-1"); h.focus({preventScroll:true}); }
  window.scrollTo(0,0);
}
function tourShow(i){
  const steps=TOUR.filter(s=>tourVisible(s.sel)); TR.steps=steps;
  i=Math.max(0,Math.min(i,steps.length-1)); TR.i=i; const s=steps[i], n=steps.length;
  const ov=document.getElementById("tour"), bub=ov.querySelector(".tour-bub"), spot=ov.querySelector(".tour-spot");
  bub.innerHTML=`<div class="tour-top"><span class="small muted">${tx(`Step ${i+1} of ${n}`,`${num(n)}টির মধ্যে ${num(i+1)} নম্বর ধাপ`)}</span>
      <button type="button" class="tour-say" data-tour="say" aria-label="${tx("Listen","শুনুন")}">${icon("speaker")}</button></div>
    <h2 id="tour-h">${L(s.t)}</h2><p id="tour-b">${L(s.b)}</p>
    ${s.lang?`<div class="set-seg tour-lang" role="group" aria-label="${tx("Language","ভাষা")}"><button type="button" data-tourlang="bn" aria-pressed="${S.lang==="bn"}">বাংলা</button><button type="button" data-tourlang="en" aria-pressed="${S.lang==="en"}">English</button></div>`:""}
    <div class="tour-dots" aria-hidden="true" data-noread>${steps.map((_,k)=>`<span class="${k===i?"on":""}"></span>`).join("")}</div>
    <div class="tour-btns">${i>0?`<button type="button" class="btn ghost" data-tour="back">${tx("Back","আগের")}</button>`:`<button type="button" class="btn ghost" data-tour="skip">${tx("Skip","বাদ দিন")}</button>`}
      <button type="button" class="btn primary" data-tour="${i===n-1?"done":"next"}">${i===0?tx("Start the guide","গাইড শুরু করুন"):i===n-1?tx("Start using NariPath","নারীপথ ব্যবহার শুরু করুন"):tx("Next","পরের")}</button></div>
    ${i>0&&i<n-1?`<button type="button" class="tour-skip" data-tour="skip">${tx("Skip the guide","গাইড বাদ দিন")}</button>`:""}`;
  const el=s.sel&&document.querySelector(s.sel);
  if(el){ const fixed=getComputedStyle(el).position==="fixed"||el.closest("nav.tabs,header");
    if(!fixed){ const r=el.getBoundingClientRect(); if(r.top<90||r.bottom>innerHeight-200) window.scrollTo({top:Math.max(0,scrollY+r.top-Math.max(110,(innerHeight-r.height)/2-80)),behavior:"instant"}); } }
  tourPlace();
  setTimeout(()=>{ const b=bub.querySelector('[data-tour="next"],[data-tour="done"]'); if(b) b.focus(); },40);
}
function tourPlace(){
  if(!TR.on) return; const s=TR.steps[TR.i]; const ov=document.getElementById("tour"), bub=ov.querySelector(".tour-bub"), spot=ov.querySelector(".tour-spot");
  const el=s&&s.sel&&document.querySelector(s.sel);
  if(!el){ spot.style.cssText="display:none"; ov.classList.add("center"); bub.style.cssText=""; return; }
  ov.classList.remove("center");
  const r=el.getBoundingClientRect(), pad=8;
  const x=Math.max(4,r.left-pad), y=Math.max(4,r.top-pad), w=Math.min(innerWidth-8,r.width+pad*2), h=Math.min(innerHeight-8,r.height+pad*2);
  spot.style.cssText=`display:block;left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
  const bw=Math.min(360,innerWidth-24); bub.style.width=bw+"px";
  const bh=bub.offsetHeight||220; let top;
  if(y+h+12+bh<innerHeight-8) top=y+h+12; else if(y-12-bh>8) top=y-12-bh; else top=Math.max(8,innerHeight-bh-8);
  let left=Math.min(Math.max(12,r.left+r.width/2-bw/2),innerWidth-bw-12);
  bub.style.top=top+"px"; bub.style.left=left+"px";
}
addEventListener("resize",()=>{ if(TR.on) tourPlace(); });
addEventListener("scroll",()=>{ if(TR.on) requestAnimationFrame(tourPlace); },{passive:true});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-tour]"); const lg=e.target.closest("[data-tourlang]");
  if(lg&&TR.on){ S.lang=lg.dataset.tourlang; store.set("lang",S.lang); document.documentElement.lang=S.lang; render(); tourShow(TR.i); const f=document.querySelector(`[data-tourlang="${S.lang}"]`); if(f) f.focus(); return; }
  if(!b||!TR.on) return; const a=b.dataset.tour;
  if(a==="next"){ stopSpeech(); tourShow(TR.i+1); } else if(a==="back"){ stopSpeech(); tourShow(TR.i-1); }
  else if(a==="skip"||a==="done") tourEnd();
  else if(a==="say"){ const s=TR.steps[TR.i]; speakChunks(speechChunks(raw(s.t)+"।\n"+raw(s.b)),S.lang==="bn"?"bn":"en"); }
});
document.addEventListener("keydown",e=>{
  if(!TR.on) return;

    if(e.shiftKey&&i<=0){ e.preventDefault(); f[f.length-1].focus(); } else if(!e.shiftKey&&i===f.length-1){ e.preventDefault(); f[0].focus(); } }
});

  for(let i=0;i<n.length;i+=2){ x0=Math.min(x0,n[i]);x1=Math.max(x1,n[i]);y0=Math.min(y0,n[i+1]);y1=Math.max(y1,n[i+1]); } b[k]=[x0,y0,x1,y1]; }); return b; })();
function fitBox(bx,pad){ const [x0,y0,x1,y1]=bx, w=x1-x0, h=y1-y0, cx=(x0+x1)/2, cy=(y0+y1)/2; const ratio=MAPDATA.h/MAPDATA.w;
  let W=Math.max(w*pad, h*pad/ratio, 260), H=W*ratio; return [cx-W/2, cy-H/2, W, H].map(v=>Math.round(v)); }
function divBox(div){ const ks=Object.keys(MAPDATA.d).filter(k=>DISTRICTS[k]&&DISTRICTS[k].div===div); if(!ks.length) return null;
  return ks.map(k=>MAP_BOX[k]).reduce((a,b)=>[Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.max(a[2],b[2]),Math.max(a[3],b[3])]); }

/* Smoothly move the map to its new view after each render */
function animateMap(){
  const svg=document.querySelector(".bdmap"); if(!svg) return;
  const to=svg.dataset.target.split(" ").map(Number), from=(S.mapVB||to).slice();
  S.mapVB=to;
  const reduce=S.a11y.motion==="reduce"||matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce||from.join()===to.join()){ svg.setAttribute("viewBox",to.join(" ")); return; }
  const t0=performance.now(), D=520, ease=x=>1-Math.pow(1-x,3);
  const step=now=>{ const p=Math.min(1,(now-t0)/D), e=ease(p); svg.setAttribute("viewBox",from.map((f,i)=>(f+(to[i]-f)*e).toFixed(1)).join(" ")); if(p<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function route(){ return (location.hash||"#home").slice(1) || "home"; }
/* Screen readers: keep focus in a sensible place after every re-render.
   New page: move focus to its heading and update the tab title so the change is announced.
   Same page: put focus back on the control that was used (it was replaced by the re-render). */
function focusKey(el){
  if(!el||el===document.body||!(el.closest("#view")||el.closest("#tabs"))) return null;
  if(el.id) return "#"+CSS.escape(el.id);
  for(const a of el.attributes){ if(a.name.startsWith("data-")) return `${el.tagName.toLowerCase()}[${a.name}="${CSS.escape(a.value)}"]`; }
  if(el.getAttribute("href")) return `a[href="${CSS.escape(el.getAttribute("href"))}"]`;
  return null;
}
let renderedRoute=null;
function afterRender(r,fk){
  const view=document.getElementById("view"), h1=view.querySelector("h1");
  document.title=(h1?h1.innerText.trim()+" · ":"")+"NariPath";
  const sk=document.getElementById("skip"); if(sk) sk.textContent=S.lang==="bn"?"মূল অংশে যান":"Skip to main content";
  const ds=document.getElementById("demo-strip"); if(ds) ds.setAttribute("aria-label",S.lang==="bn"?"প্রোটোটাইপ নোটিশ":"Prototype notice");
  const changed=renderedRoute!==null&&renderedRoute!==r, first=renderedRoute===null; renderedRoute=r;
  if(first) return;
  if(changed){ const tgt=h1||view; if(tgt!==view) tgt.setAttribute("tabindex","-1"); try{ tgt.focus({preventScroll:true}); }catch(e){} return; }
  if(fk&&(document.activeElement===document.body||!document.activeElement)){ const el=document.querySelector(fk); if(el){ try{ el.focus({preventScroll:true}); }catch(e){} } }
}

  afterRender(r,fk);
  if(r==="settings") settingsVoiceInfo();
  if(r==="home"&&!TR.on&&!TR.auto&&!store.get("tour",0)&&!navigator.webdriver){ TR.auto=true; setTimeout(()=>{ if(route()==="home") startTour(false); },reduceMotion()?300:1500); }
  if(r==="map") animateMap();
  const rv=document.querySelector(".stitch .reveal");
  if(rv){ try{ rv.style.setProperty("--len", Math.ceil(rv.getTotalLength())); }catch(e){} if(!S.sewn) setTimeout(()=>{S.sewn=true;},3200); }
  if(reduceMotion()) S.sewn=true;
  const wk=document.querySelector(".walker"), wp=document.getElementById("walkPath");
  if(wk&&wp&&!wk.querySelector("animateMotion")){ try{ const pt=wp.getPointAtLength(wp.getTotalLength()*.975); wk.setAttribute("transform",`translate(${pt.x.toFixed(1)} ${pt.y.toFixed(1)})`); }catch(e){} }
}
function reduceMotion(){ if(S.a11y.motion==="reduce") return true; try{ return matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } }
let lastRoute=route();
window.addEventListener("hashchange",()=>{
  const r=route(); S.clearArmed=false; if(r!=="path"){S.flash="";S.revealed=false;}
  if(r!==lastRoute){S.reportOpen=false;S.reportDone=false;stopSpeech();}
  const go=()=>{ render(); if(r!==lastRoute){window.scrollTo(0,0);} lastRoute=r; };
  const reduce = (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) || S.a11y.motion==="reduce";
  if(document.startViewTransition && r!==lastRoute && !reduce){ try{ const vt=document.startViewTransition(go); ["ready","finished","updateCallbackDone"].forEach(k=>vt[k]&&vt[k].catch(()=>{})); }catch(e){ go(); } } else go();
});

/* ---------------- Events ---------------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-lang],[data-sit],[data-pillar],[data-stage],[data-reset],[data-fp],[data-clearstage],[data-save],[data-startpath],[data-rmpath],#clear-btn,#nav-go,#nav-restart");
  if(!el) return;
  if(el.dataset.lang){S.lang=el.dataset.lang;store.set("lang",S.lang);render();return;}
  if(el.dataset.sit){ if(el.dataset.sit==="local"){location.hash="district";return;} S.nav={sit:el.dataset.sit,district:"",freeFirst:true,done:false};location.hash="navigator";if(route()==="navigator")render();return;}
  if(el.dataset.pillar){S.q="";S.district="";S.cost="";S.status="";S.stage="";S.pillar=+el.dataset.pillar;if(route()==="explore"){e.preventDefault();render();}return;}
  if(el.dataset.stage){S.q="";S.pillar=0;S.district="";S.cost="";S.status="";S.stage=el.dataset.stage;if(route()==="explore"){e.preventDefault();render();}return;}
  if(el.dataset.reset){S.q="";S.pillar=0;S.district="";S.cost="";S.status="";S.stage="";if(route()==="explore"){e.preventDefault();render();}return;}
  if(el.dataset.fp!==undefined){S.pillar=+el.dataset.fp;render();return;}
  if(el.dataset.clearstage){S.stage="";render();return;}
  if(el.dataset.save){const id=el.dataset.save;S.saved=S.saved.includes(id)?S.saved.filter(x=>x!==id):[...S.saved,id];persist();render();return;}
  if(el.dataset.startpath){const id=el.dataset.startpath;if(!S.paths[id]){S.paths[id]={done:steps(byId(id)).map(()=>false)};persist();}
    location.hash="path";setTimeout(()=>{const a=document.getElementById("path-"+id);if(a)a.scrollIntoView({block:"start"});},30);return;}
  if(el.dataset.rmpath){delete S.paths[el.dataset.rmpath];persist();render();return;}
  if(el.id==="clear-btn"){ if(!S.clearArmed){S.clearArmed=true;render();return;}
    S.saved=[];S.paths={};S.plans={};S.reminders=[];S.apps=[];S.mig={before:[],abroad:[],home:[]};S.dis={before:[],during:[],after:[]};S.ps={done:[],card:0,check:null};S.pss=[];S.pcal={days:[],pin:null};S.pcalOpen=false;S.a11y=Object.assign({},A11Y_DEFAULT);applyA11y();S.reports=[];S.hide=false;S.revealed=false;S.clearArmed=false;store.clear();store.set("saved",[]);store.set("paths",{});S.flash=t("cleared");render();return;}
  if(el.id==="nav-go"){S.nav.district=document.getElementById("nav-district").value;S.nav.freeFirst=document.getElementById("nav-free").checked;S.nav.done=true;render();window.scrollTo(0,0);return;}
  if(el.id==="nav-restart"){location.hash="home";return;}
});
document.addEventListener("change",e=>{
  const id=e.target.id;
  if(id==="f-district"){S.district=e.target.value;render();}
  else if(id==="f-cost"){S.cost=e.target.value;render();}
  else if(id==="f-status"){S.status=e.target.value;render();}
  else if(id==="d-pick"){S.district=e.target.value;render();}
  else if(e.target.dataset.pck){ const sid=e.target.dataset.pck, plan=PLANS[sid], p=S.plans[sid]; if(!plan||!p) return; p.done=plan.map((_,i)=>!!(p.done||[])[i]); p.done[+e.target.dataset.i]=e.target.checked; persist(); render(); }
  else if(id==="hide-toggle"){S.hide=e.target.checked;S.revealed=false;store.set("hide",S.hide);render();}
  else if(e.target.dataset.ck){const id=e.target.dataset.ck, r=byId(id), p=S.paths[id]; if(!r||!p) return; const n=steps(r).length; p.done=Array.from({length:n},(_,i)=>!!(p.done||[])[i]); p.done[+e.target.dataset.i]=e.target.checked;persist();render();}
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="home-search"){S.q=document.getElementById("home-q").value;S.pillar=0;S.district="";S.cost="";S.status="";S.stage="";location.hash="explore";if(route()==="explore")render();}
  if(e.target.id==="ex-search"){S.q=document.getElementById("ex-q").value;render();const i=document.getElementById("ex-q");i.focus();i.setSelectionRange(i.value.length,i.value.length);}
});
document.addEventListener("input",e=>{
  if(e.target.id==="ex-q"){S.q=e.target.value;const pos=e.target.selectionStart;render();const i=document.getElementById("ex-q");i.focus();i.setSelectionRange(pos,pos);}
});

if(route()==="navigator") location.hash="home";
render();
</script>
</body>
